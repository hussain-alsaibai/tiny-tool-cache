[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-tool-cache"
version = "0.1.0"
description = "stdlib-only tool/LLM call result cache with TTL, negative-result caching, SWR, and crash-safe disk persistence"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
  { name = "OpenClaw", email = "hussain.alsaibai@gmail.com" },
]
keywords = ["cache", "tool", "agent", "ttl", "lru", "stale-while-revalidate", "swr", "stdlib"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-tool-cache"
Issues = "https://github.com/hussain-alsaibai/tiny-tool-cache/issues"
Source = "https://github.com/hussain-alsaibai/tiny-tool-cache"

[tool.setuptools]
py-modules = ["tiny_tool_cache"]
